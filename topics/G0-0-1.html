<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G0-0-1 中音子音字母</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Sarabun:wght@300;400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0d1117;--surface:#161b22;--card:#1c2128;--border:#30363d;
  --violet:#bc8cff;--text:#e6edf3;--text-mid:#adbac7;--text-dim:#7d8590;
}
body {
  min-height:100vh;
  background:var(--bg);
  font-family:'Noto Serif TC',serif;
  padding:24px 16px 60px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.back-link {
  font-family:'DM Mono',monospace;
  font-size:0.8rem;
  color:var(--text-dim);
  text-decoration:none;
  display:inline-block;
  margin-bottom:24px;
  transition:color 0.2s;
}
.back-link:hover { color:var(--violet); }
.header { width:100%; max-width:860px; margin-bottom:28px; }
.header-eyebrow {
  font-family:'DM Mono',monospace;
  font-size:0.7rem;
  letter-spacing:0.35em;
  color:var(--text-dim);
  text-transform:uppercase;
  margin-bottom:8px;
}
.header-title { font-size:1.9rem; color:var(--violet); font-weight:700; margin-bottom:6px; }
.header-subtitle { font-size:0.9rem; color:var(--text-mid); }
.container { width:100%; max-width:860px; }

/* ── Desktop: table ── */
table.consonant-table {
  width:100%;
  border-collapse:collapse;
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.consonant-table thead tr { background:var(--surface); }
.consonant-table th {
  color:var(--text-dim);
  font-family:'DM Mono',monospace;
  font-size:0.72rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  padding:13px 16px;
  text-align:center;
  border-bottom:2px solid var(--border);
  font-weight:500;
}
.consonant-table th:first-child { text-align:left; }
.consonant-table td {
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  text-align:center;
  vertical-align:middle;
}
.consonant-table tbody tr:last-child td { border-bottom:none; }
.consonant-table tbody tr:hover td { background:rgba(255,255,255,0.02); }

/* Letter cell */
.letter-cell { display:flex; align-items:center; gap:12px; }
.letter-thai {
  font-family:'Sarabun',sans-serif;
  font-size:2.4rem;
  color:var(--violet);
  font-weight:600;
  line-height:1;
  min-width:44px;
  text-align:center;
}
.letter-phoneme {
  font-family:'DM Mono',monospace;
  font-size:0.78rem;
  color:var(--text-mid);
}

/* Vowel buttons */
.vowel-btn {
  display:inline-block;
  font-family:'DM Mono',monospace;
  font-size:0.72rem;
  padding:6px 14px;
  border-radius:8px;
  text-decoration:none;
  transition:all 0.2s;
  white-space:nowrap;
}
.vowel-btn.available {
  background:rgba(188,140,255,0.1);
  border:1px solid rgba(188,140,255,0.35);
  color:var(--violet);
}
.vowel-btn.available:hover {
  background:rgba(188,140,255,0.22);
  border-color:var(--violet);
  transform:translateY(-1px);
  box-shadow:0 2px 8px rgba(188,140,255,0.2);
}
.vowel-btn.pending {
  background:var(--surface);
  border:1px dashed var(--border);
  color:var(--text-dim);
  cursor:default;
  pointer-events:none;
  opacity:0.45;
}

/* Legend */
.legend {
  display:flex; gap:20px; margin-top:18px;
  font-family:'DM Mono',monospace; font-size:0.72rem; color:var(--text-dim); align-items:center;
}
.legend-item { display:flex; align-items:center; gap:6px; }
.legend-dot { width:8px; height:8px; border-radius:50%; }
.legend-dot.available { background:var(--violet); }
.legend-dot.pending   { background:var(--border); }

/* Footer */
.footer { width:100%; max-width:860px; margin-top:40px; padding-top:20px; border-top:1px solid var(--border); text-align:center; }
.footer-text { font-family:'DM Mono',monospace; font-size:0.75rem; color:var(--text-dim); }

/* ── Mobile: card layout ── */
@media (max-width:639px) {
  .consonant-table {
    display:block; background:transparent; box-shadow:none; border-radius:0; overflow:visible;
  }
  .consonant-table thead { display:none; }
  .consonant-table tbody { display:block; }

  .consonant-table tbody tr {
    display:flex; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    margin-bottom:12px; padding:14px;
  }
  .consonant-table tbody tr:last-child { margin-bottom:0; }
  .consonant-table td { display:block; border:none; padding:0; }

  /* Letter: full width */
  .consonant-table td:first-child {
    flex:0 0 100%;
    padding-bottom:12px; margin-bottom:12px;
    border-bottom:1px solid var(--border);
  }

  /* Three vowel cells in a row */
  .consonant-table td:not(:first-child) {
    flex:0 0 33.33%;
    display:flex; align-items:center; justify-content:center;
    padding:0 3px;
  }

  .vowel-btn { width:100%; text-align:center; padding:8px 4px; font-size:0.7rem; }
}
</style>
</head>
<body>
